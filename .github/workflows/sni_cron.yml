name: SNI host scan

on:
  schedule:
    - cron: "0 */2 * * *"   # every 2 hours
  workflow_dispatch:         # manual "Run workflow" button
  push:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Harvest + scan + verify hosts
        run: python main.py --reuse-harvest

      - name: Commit updated clean_hosts.txt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clean_hosts.txt
          git diff --cached --quiet || git commit -m "chore(scan): refresh verified SNI hosts [$(date -u +'%Y-%m-%d %H:%M UTC')]"
          git push

      - name: Keep Render awake + sync check
        run: |
          curl -s -o /dev/null -w "Render ping: %{http_code}\n" \
            https://luphahla-bugscan.onrender.com/healthz || true
