name: SNI Cron Scanner

on:
  schedule:
    - cron: "0 */2 * * *"     # every 2 hours
  workflow_dispatch:           # manual trigger button

permissions:
  contents: write              # required for auto-commit to main

concurrency:
  group: sni-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run SNI scan pipeline
        run: |
          python main.py --output clean_hosts.txt

      - name: Commit verified hosts
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clean_hosts.txt
          if git diff --cached --quiet; then
            echo "No changes to verified hosts — skipping commit."
          else
            git commit -m "chore(scan): refresh verified SNI hosts [$(date -u '+%Y-%m-%d %H:%M UTC')]"
            git push origin main
          fi
